services:
  - type: web
    name: tuition-manager-api
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATA_DIR
        value: /var/data
      - key: FRONTEND_ORIGIN
        sync: false
    disk:
      name: tuition-manager-data
      mountPath: /var/data
      sizeGB: 1
